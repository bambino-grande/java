spring.application.name=storage-service
server.port=8082
logging.pattern.level=%5p [traceId=%X{traceId:-}]

spring.datasource.url=jdbc:postgresql://localhost:5434/storage-service
spring.datasource.username=storage-service
spring.datasource.password=password

spring.liquibase.change-log=classpath:db/storage-service/db.changelog-master.yaml
spring.liquibase.enabled=true

spring.rabbitmq.host = localhost
spring.rabbitmq.port = 5672
storage-service.grpc.port=9092

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/bambino-grande
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/bambino-grande/protocol/openid-connect/certs
jwt.auth.converter.principal-attribute=sub
jwt.auth.converter.resource-id=bambino-grande-rest-api

outbox.publisher.fixed-delay-ms=1000